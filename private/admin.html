<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Administração — MesaPronta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F2; --panel:#FFFFFF; --ink:#1C1917; --muted:#78716C; --line:#E7E5E4; --line2:#F1EFEC;
  --accent:#B4442A; --accent-ink:#fff; --accent-soft:#F8E9E4; --accent-dark:#933620;
  --trial:#1D4ED8; --trial-bg:#E8EEFC;
  --active:#15803D; --active-bg:#E5F4EA;
  --overdue:#B45309; --overdue-bg:#FDF0DC;
  --danger:#B91C1C; --danger-bg:#FCE8E8;
  --suspended:#57534E; --suspended-bg:#EEECEA;
  --canceled:#F5F5F4; --canceled-bg:#44403C;
  --radius:10px; --shadow:0 1px 2px rgba(28,25,23,.05),0 1px 1px rgba(28,25,23,.03);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num,.money{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:20px}
h2{font-size:15px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--line2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-dark)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{color:var(--danger);border-color:#F3C7C7}
.btn.danger-ghost:hover{background:var(--danger-bg)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.loading{position:relative;color:transparent!important}
.btn.loading::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-color:var(--muted) transparent var(--muted) transparent;animation:spin .7s linear infinite}
.btn.primary.loading::after,.btn.danger.loading::after{border-color:#fff transparent #fff transparent}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--muted)}
.input,select.input,textarea.input{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:14px;width:100%;min-width:0}
textarea.input{height:auto;min-height:84px;padding:8px 10px;resize:vertical;line-height:1.45}
.input:focus{outline:2px solid rgba(180,68,42,.25);outline-offset:0;border-color:var(--accent)}
.btn:focus-visible,a:focus-visible,.nav a:focus-visible,tr.click:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.login-card form{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.form-error{color:var(--danger);font-size:13px;min-height:18px}

/* Layout */
#app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.sidebar .brand{padding:0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a svg{width:16px;height:16px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-dark)}
.nav a.on svg{color:var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:flex;flex-direction:column;gap:8px}
.side-foot .who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{min-width:0;padding:24px 28px 48px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.crumb{font-size:12.5px;color:var(--muted);text-decoration:none;display:inline-flex;gap:4px;align-items:center;margin-bottom:6px}
.crumb:hover{color:var(--ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-body{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.kpi.hl{border-color:#EBC9BF;background:linear-gradient(0deg,#fff,#fff) padding-box}
.kpi.hl .val{color:var(--accent-dark)}

/* Tabelas */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFAF8}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:#FBFAF8}
td .sub{font-size:12px;color:var(--muted);margin-top:1px}
td.r,th.r{text-align:right}
td.nowrap{white-space:nowrap}
.t-clients{min-width:820px}
.t-inv{min-width:820px}
.t-inv td:nth-child(2){min-width:200px}
.t-bill{min-width:640px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Badges */
.em-ajuste{display:inline-flex;align-items:center;margin-left:8px;padding:0 8px;height:20px;border-radius:999px;background:var(--overdue-bg);color:var(--overdue);font-size:11px;font-weight:600;white-space:nowrap;vertical-align:middle}
.aviso-ajuste{margin:0 0 14px;padding:10px 12px;border-radius:var(--radius);background:var(--overdue-bg);color:var(--ink);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-trial{color:var(--trial);background:var(--trial-bg)}
.b-active,.b-paid{color:var(--active);background:var(--active-bg)}
.b-overdue{color:var(--danger);background:var(--danger-bg)}
.b-pending{color:var(--overdue);background:var(--overdue-bg)}
.b-suspended{color:var(--suspended);background:var(--suspended-bg)}
.b-canceled{color:var(--canceled);background:var(--canceled-bg)}
.b-canceled::before{opacity:.7}
.plan-tag{font-size:12px;font-weight:500;padding:2px 7px;border:1px solid var(--line);border-radius:6px;white-space:nowrap}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 240px;min-width:0;max-width:380px}
.search svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--line2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.count-note{font-size:12px;color:var(--muted);margin-left:auto}

/* Lista simples */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line2);cursor:pointer;min-width:0}
.list li:last-child{border-bottom:none}
.list li:hover{background:#FBFAF8}
.list .grow{flex:1;min-width:0}
.list .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Detalhe */
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.inline-form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:14px 16px;border-top:1px solid var(--line);background:#FBFAF8}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.danger-zone{border-color:#F3C7C7}
.danger-zone .card-head{border-color:#F3C7C7}
.danger-zone .card-head h2{color:var(--danger)}
.dz-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.notes-box{white-space:pre-wrap}
.pill-link{display:inline-flex;gap:4px;align-items:center;text-decoration:none;font-weight:500}
.pill-link svg{width:13px;height:13px}

/* Skeleton / loading */
.skel{background:linear-gradient(90deg,#EFEDEA 25%,#F6F5F2 50%,#EFEDEA 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px;height:14px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-block{padding:32px;display:grid;place-items:center;color:var(--muted);gap:10px}
.spinner{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite}

/* Toasts */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:9px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;gap:10px;align-items:flex-start;animation:tin .18s ease-out;max-width:380px}
.toast.err{background:var(--danger)}
.toast .ic{font-weight:700}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(28,25,23,.45);display:grid;place-items:center;padding:16px;z-index:90;animation:fin .12s}
@keyframes fin{from{opacity:0}}
.modal{background:#fff;border-radius:14px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.modal header{padding:16px 18px 0}
.modal .mb{padding:10px 18px 4px;color:var(--ink)}
.modal .mb p{margin:0 0 10px;color:var(--muted)}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px 16px}
.modal code{background:var(--line2);padding:1px 6px;border-radius:5px;font-size:13px;color:var(--ink)}

/* Mobile */
@media (max-width:1100px){
  .detail-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .sidebar{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;gap:10px;padding:8px 12px;border-right:none;border-bottom:1px solid var(--line)}
  .sidebar .brand small{display:none}
  .sidebar .brand span.bt{display:none}
  .sidebar .brand{padding:0}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0;gap:2px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:7px 10px;white-space:nowrap;font-size:13px}
  .nav a svg{display:none}
  .side-foot{margin:0;border:none;padding:0;flex-direction:row}
  .side-foot .who{display:none}
  main{padding:16px 16px 40px}
  .grid2,.grid3,.form-grid{grid-template-columns:minmax(0,1fr)}
  .inline-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .inline-form .desc{grid-column:1/-1}
  .inline-form .btn{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:18px}
  .count-note{margin-left:0;width:100%}
  .search{max-width:none}
}
</style>
</head>
<body>

<!-- Tela de login -->
<section id="login" class="hidden" aria-labelledby="login-title">
  <div class="login-card">
    <div class="brand"><div class="brand-mark">M</div><div>MesaPronta<small>Administração</small></div></div>
    <form id="login-form" novalidate>
      <h1 id="login-title" style="font-size:17px">Entrar no painel</h1>
      <label class="field">E-mail<input class="input" type="email" name="email" autocomplete="username" required></label>
      <label class="field">Senha<input class="input" type="password" name="password" autocomplete="current-password" required></label>
      <div class="form-error" id="login-error" role="alert"></div>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </div>
</section>

<!-- Aplicativo -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">M</div><span class="bt">MesaPronta<small>Administração</small></span></div>
    <nav class="nav" aria-label="Seções">
      <a href="#/visao" data-nav="visao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Visão geral</a>
      <a href="#/clientes" data-nav="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clientes</a>
      <a href="#/cobrancas" data-nav="cobrancas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Cobranças<span class="em-ajuste" data-em-ajuste="pagamento">Em ajuste</span></a>
      <a href="#/config" data-nav="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Configurações</a>
    </nav>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <button class="btn sm" id="logout" type="button">Sair</button>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>

<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
(function () {
  // ---------- Utilidades ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' };
  // ETIQUETA "EM AJUSTE" — pagamento
  // Ordem do dono do projeto em 05/11/2026: "deixa pendurado essa pendência de pagamento, não é algo que vamos definir agora".
  // Situação: a cobrança é manual (PIX + comprovante pelo WhatsApp; o admin dá baixa com "Marcar como pago").
  // Não existe gateway (Asaas, Mercado Pago…), pagamento online nem baixa automática. Boleto e cartão ainda não são oferecidos de verdade.
  // A causa NÃO foi investigada: é uma decisão de produto em aberto, não um defeito diagnosticado.
  // Para tirar: confirme com o dono que o pagamento foi definido e integrado, mude a flag para false
  // e apague a linha em PENDENCIAS.md e a checagem em scripts/checar-etiquetas.sh.
  const EM_AJUSTE = { pagamento: true };
  const SELO = '<span class="em-ajuste" title="Sem gateway de pagamento">Em ajuste</span>';
  const AVISO_PAGAMENTO = '<div class="aviso-ajuste"><b>Em ajuste:</b> ainda não há pagamento online nem baixa automática. Confira o comprovante PIX recebido e use “Marcar como pago” em cada fatura.</div>';
  if (!EM_AJUSTE.pagamento) document.querySelectorAll('[data-em-ajuste=pagamento]').forEach((e) => e.remove());
  const esc = (v) => String(v ?? '').replace(/[&<>"'`]/g, (c) => ESC_MAP[c]);
  const digits = (v) => String(v ?? '').replace(/\D/g, '');

  const STATUS = { trial: 'Em teste', active: 'Ativo', overdue: 'Inadimplente', suspended: 'Suspenso', canceled: 'Cancelado' };
  const INV_STATUS = { pending: 'Em aberto', paid: 'Pago', overdue: 'Vencida', canceled: 'Cancelada' };
  const PLANS = { essencial: 'Essencial', profissional: 'Profissional', premium: 'Premium' };
  const METHODS = { pix: 'PIX', boleto: 'Boleto', cartao: 'Cartão', dinheiro: 'Dinheiro' };
  const THEMES = { elegante: 'Elegante', moderno: 'Moderno', industrial: 'Industrial', minimalista: 'Minimalista' };

  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const money = (cents) => brl.format((Number(cents) || 0) / 100);
  function parseMoney(str) {
    let s = String(str || '').replace(/[R$\s]/g, '');
    if (!s) return NaN;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) : NaN;
  }
  function fmtDate(v) {
    if (!v) return '—';
    const s = String(v);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; }
    const d = new Date(s);
    return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR');
  }
  function fmtDateTime(v) {
    if (!v) return '—';
    const d = new Date(v);
    return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  function relTime(v) {
    if (!v) return '';
    const diff = (Date.now() - new Date(v).getTime()) / 1000;
    if (!Number.isFinite(diff)) return '';
    if (diff < 60) return 'agora mesmo';
    if (diff < 3600) return `há ${Math.floor(diff / 60)} min`;
    if (diff < 86400) return `há ${Math.floor(diff / 3600)} h`;
    const d = Math.floor(diff / 86400);
    return d === 1 ? 'ontem' : `há ${d} dias`;
  }
  // Data local AAAA-MM-DD
  const isoLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const todayISO = () => isoLocal(new Date());
  const addDaysISO = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return isoLocal(d); };
  function daysUntil(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
    const [y, m, d] = iso.split('-').map(Number);
    const t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((new Date(y, m - 1, d) - t) / 864e5);
  }
  function fmtPhone(v) {
    const d = digits(v);
    if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    return d || '—';
  }
  function waLink(v) {
    let d = digits(v);
    if (!d) return '';
    if (d.length <= 11) d = '55' + d;
    return 'https://wa.me/' + d;
  }
  function fmtDoc(v) {
    const d = digits(v);
    if (d.length === 11) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
    if (d.length === 14) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
    return d || '—';
  }
  const docKind = (v) => { const n = digits(v).length; return n === 11 ? 'CPF' : n === 14 ? 'CNPJ' : 'Documento'; };
  const fmtCep = (v) => { const d = digits(v); return d.length === 8 ? d.slice(0, 5) + '-' + d.slice(5) : (d || ''); };
  const safeHttp = (u) => /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
  const badge = (st) => `<span class="badge b-${esc(STATUS[st] ? st : 'suspended')}">${esc(STATUS[st] || st || '—')}</span>`;
  const invBadge = (st) => `<span class="badge b-${esc(INV_STATUS[st] ? st : 'suspended')}">${esc(INV_STATUS[st] || st || '—')}</span>`;
  const planTag = (p) => `<span class="plan-tag">${esc(PLANS[p] || p || '—')}</span>`;
  const loadingBlock = (msg = 'Carregando…') => `<div class="loading-block"><div class="spinner"></div><span>${esc(msg)}</span></div>`;
  const ICON_EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
  const ICON_SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>';

  // ---------- Toasts ----------
  function toast(msg, kind = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'err' ? ' err' : '');
    el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
    el.innerHTML = `<span class="ic">${kind === 'err' ? '!' : '✓'}</span><span>${esc(msg)}</span>`;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, kind === 'err' ? 5000 : 3000);
  }

  // ---------- Modal ----------
  // opts: { title, body (HTML já escapado), confirm, danger, cancel, onOpen(root, setEnabled), onConfirm(root) → Promise (lançar erro mantém o modal aberto) }
  function modal(opts) {
    return new Promise((resolve) => {
      const prevFocus = document.activeElement;
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <header><h2 id="m-title">${esc(opts.title)}</h2></header>
        <form class="mb" novalidate>${opts.body || ''}
          <footer style="padding:14px 0 12px">
            <button type="button" class="btn" data-cancel>${esc(opts.cancel || 'Cancelar')}</button>
            <button type="submit" class="btn ${opts.danger ? 'danger' : 'primary'}" data-ok>${esc(opts.confirm || 'Confirmar')}</button>
          </footer></form></div>`;
      document.body.appendChild(bg);
      const form = $('form', bg), ok = $('[data-ok]', bg);
      const close = (val) => { bg.remove(); document.removeEventListener('keydown', onKey); if (prevFocus && prevFocus.focus) prevFocus.focus(); resolve(val); };
      const onKey = (e) => { if (e.key === 'Escape') close(false); };
      document.addEventListener('keydown', onKey);
      $('[data-cancel]', bg).onclick = () => close(false);
      bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(false); });
      if (opts.onOpen) opts.onOpen(bg, (on) => { ok.disabled = !on; });
      form.onsubmit = async (e) => {
        e.preventDefault();
        if (ok.disabled) return;
        if (!opts.onConfirm) return close(true);
        ok.classList.add('loading'); ok.disabled = true;
        try { const r = await opts.onConfirm(bg); close(r === undefined ? true : r); }
        catch (err) { toast(err.message, 'err'); ok.classList.remove('loading'); ok.disabled = false; }
      };
      setTimeout(() => { const f = $('input,select,textarea', bg) || ok; f.focus(); }, 10);
    });
  }

  // ---------- API ----------
  async function api(method, path, body) {
    let res;
    try {
      res = await fetch('/api/admin' + path, {
        method, credentials: 'same-origin',
        headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
    } catch { throw new Error('Sem conexão com o servidor.'); }
    let data = {};
    try { data = await res.json(); } catch { /* sem corpo */ }
    if (res.status === 401 && path !== '/login') { showLogin('Sua sessão expirou. Entre novamente.'); throw new Error('Sessão expirada.'); }
    if (!res.ok) throw new Error(data.error || `Erro ${res.status}.`);
    return data;
  }
  async function withBtn(btn, fn) {
    btn.classList.add('loading'); btn.disabled = true;
    try { return await fn(); } finally { btn.classList.remove('loading'); btn.disabled = false; }
  }

  // ---------- Autenticação ----------
  let me = null;
  function showLogin(msg) {
    me = null;
    $('#app').classList.add('hidden');
    $('#login').classList.remove('hidden');
    $('#login-error').textContent = msg || '';
    $$('.modal-bg').forEach((m) => m.remove());
    setTimeout(() => $('#login-form [name=email]').focus(), 10);
  }
  function showApp() {
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#who').textContent = me?.email || '';
    route();
  }
  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target, btn = $('button[type=submit]', f);
    const email = f.email.value.trim(), password = f.password.value;
    if (!email || !password) { $('#login-error').textContent = 'Informe e-mail e senha.'; return; }
    $('#login-error').textContent = '';
    try {
      await withBtn(btn, () => api('POST', '/login', { email, password }));
      const r = await api('GET', '/me');
      me = r.admin; f.password.value = '';
      showApp();
    } catch (err) { $('#login-error').textContent = err.message; }
  });
  $('#logout').addEventListener('click', async () => {
    try { await api('POST', '/logout'); } catch { /* ignora */ }
    showLogin('Você saiu do painel.');
  });

  // ---------- Roteamento (hash) ----------
  let routeToken = 0;
  const view = () => $('#view');
  function route() {
    if (!me) return;
    const h = location.hash.replace(/^#\/?/, '') || 'visao';
    const [sec, id] = h.split('/');
    $$('.nav a').forEach((a) => a.classList.toggle('on', a.dataset.nav === sec));
    const token = ++routeToken;
    const isCurrent = () => token === routeToken;
    window.scrollTo(0, 0);
    if (sec === 'clientes' && id) return pageClient(decodeURIComponent(id), isCurrent);
    if (sec === 'clientes') return pageClients(isCurrent);
    if (sec === 'cobrancas') return pageBilling(isCurrent);
    if (sec === 'config') return pageSettings(isCurrent);
    return pageOverview(isCurrent);
  }
  window.addEventListener('hashchange', route);
  const go = (hash) => { if (location.hash === hash) route(); else location.hash = hash; };
  const clientHash = (id) => '#/clientes/' + encodeURIComponent(id);

  // Clique em linhas/itens com data-open (delegado)
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-open]');
    if (el && !e.target.closest('a,button')) go(clientHash(el.dataset.open));
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-open]')) { e.preventDefault(); go(clientHash(e.target.dataset.open)); }
  });

  function errorBlock(msg) {
    return `<div class="card"><div class="empty">${esc(msg)}<div style="margin-top:12px"><button class="btn sm" type="button" onclick="location.reload()">Tentar novamente</button></div></div></div>`;
  }

      <div class="card" style="max-width:760px">

            <dt>Endereço</dt><dd>/${esc(t.slug)}</dd>
            <dt>Plano</dt><dd>${esc(PLANS[t.plan] || t.plan)}</dd>
            <dt>Status</dt><dd>${esc(STATUS[t.status] || t.status)}</dd>
            <dt>Fim do teste</dt><dd class="num">${esc(fmtDate(t.trial_ends_at))}</dd>
            <dt>Próx. vencimento</dt><dd class="num">${esc(fmtDate(t.next_due_date))}</dd>
            <dt>Cadastro</dt><dd class="num">${esc(fmtDateTime(t.created_at))}</dd>
            <dt>ID</dt><dd class="small muted">${esc(t.id)}</dd>
          </dl></div></div>

          <div class="card"><div class="card-head"><h2>Responsável</h2></div><div class="card-body"><dl class="kv">
            <dt>Nome</dt><dd>${esc(o.name || '—')}</dd>
            <dt>E-mail</dt><dd>${o.email ? `<a href="mailto:${esc(o.email)}">${esc(o.email)}</a>` : '—'}</dd>
            <dt>WhatsApp</dt><dd class="num">${wa ? `<a class="pill-link" href="${esc(wa)}" target="_blank" rel="noopener noreferrer">${esc(fmtPhone(o.phone))} ${ICON_EXT}</a>` : '—'}</dd>
            <dt>Último acesso</dt><dd class="num">${o.last_login_at ? `${esc(fmtDateTime(o.last_login_at))} <span class="muted small">(${esc(relTime(o.last_login_at))})</span>` : '<span class="muted">Nunca entrou após o cadastro</span>'}</dd>
          </dl></div></div>

          <div class="card"><div class="card-head"><h2>Dados de cobrança</h2></div><div class="card-body"><dl class="kv">
            <dt>Razão social</dt><dd>${esc(bp.legal_name || '—')}</dd>
            <dt>${esc(docKind(bp.document))}</dt><dd class="num">${esc(fmtDoc(bp.document))}</dd>
            <dt>E-mail</dt><dd>${esc(bp.email || '—')}</dd>
            <dt>Telefone</dt><dd class="num">${esc(bp.phone ? fmtPhone(bp.phone) : '—')}</dd>
            <dt>Endereço</dt><dd>${addr.length ? addr.map(esc).join('<br>') : '—'}</dd>
            <dt>Dia de cobrança</dt><dd class="num">${esc(bp.billing_day ?? '—')}</dd>
            <dt>Forma de pagamento</dt><dd>${esc(METHODS[bp.payment_method] || bp.payment_method || '—')}</dd>
          </dl></div></div>

          <div class="card"><div class="card-head"><h2>Site</h2>${siteUrl ? `<a class="pill-link small" href="${esc(siteUrl)}" target="_blank" rel="noopener noreferrer">Abrir site ${ICON_EXT}</a>` : ''}</div><div class="card-body"><dl class="kv">
            <dt>Tema</dt><dd>${esc(THEMES[site.theme] || site.theme || '—')}</dd>
            <dt>Fotos na galeria</dt><dd class="num">${esc(site.photos ?? 0)}</dd>
            <dt>Última edição</dt><dd class="num">${site.updatedAt ? esc(fmtDateTime(site.updatedAt)) : '<span class="muted">Ainda não editado</span>'}</dd>
            <dt>URL</dt><dd class="small">${siteUrl ? esc(siteUrl) : '—'}</dd>
          </dl></div></div>
        </div>
      </div>`;

    const reload = async () => {
      try { const nd = await api('GET', '/tenants/' + encodeURIComponent(t.id)); if (isCurrent()) renderClient(nd, isCurrent); }
      catch (err) { toast(err.message, 'err'); }
    };

    // Salvar dados do tenant
    $('#tenant-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = $('button[type=submit]', f);
      const body = { plan: f.plan.value, status: f.status.value, notes: f.notes.value };
      if (f.next_due_date.value) body.next_due_date = f.next_due_date.value;
      try {
        await withBtn(btn, () => api('PATCH', '/tenants/' + encodeURIComponent(t.id), body));
        toast('Cliente atualizado.');
        reload();
      } catch (err) { toast(err.message, 'err'); }
    });

    // Nova cobrança
    $('#inv-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = $('button[type=submit]', f);
      const cents = parseMoney(f.amount.value);
      if (!(cents > 0)) { toast('Informe um valor válido, ex.: 79,00.', 'err'); f.amount.focus(); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f.due_date.value)) { toast('Informe a data de vencimento.', 'err'); f.due_date.focus(); return; }
      const body = { amount_cents: cents, due_date: f.due_date.value };
      if (f.description.value.trim()) body.description = f.description.value.trim();
      try {
        await withBtn(btn, () => api('POST', '/tenants/' + encodeURIComponent(t.id) + '/invoices', body));
        toast(`Cobrança de ${money(cents)} criada.`);
        reload();
      } catch (err) { toast(err.message, 'err'); }
    });

    // Ações nas faturas
    $$('[data-act]', view()).forEach((b) => b.addEventListener('click', async () => {
      const inv = invs.find((i) => i.id === b.dataset.inv);
      if (!inv) return;
      const label = `${inv.reference} · ${money(inv.amount_cents)}`;
      const patch = (body) => api('PATCH', '/invoices/' + encodeURIComponent(inv.id), body);
      let done = false;
      if (b.dataset.act === 'pay') {
        done = await modal({
          title: 'Marcar como pago',
          body: `<p>Fatura <b>${esc(label)}</b>. A próxima mensalidade é gerada automaticamente se não houver outra em aberto.</p>
            <label class="field">Forma de pagamento<select class="input" name="method">${Object.entries(METHODS).map(([k, l]) => `<option value="${esc(k)}"${k === (bp.payment_method || 'pix') ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`,
          confirm: 'Confirmar pagamento',
          onConfirm: (root) => patch({ status: 'paid', method: $('[name=method]', root).value }),
        });
        if (done) toast('Pagamento registrado.');
      } else if (b.dataset.act === 'cancel') {
        done = await modal({
          title: 'Cancelar fatura', danger: true, confirm: 'Cancelar fatura', cancel: 'Voltar',
          body: `<p>A fatura <b>${esc(label)}</b> deixará de ser cobrada. Você pode reabri-la depois.</p>`,
          onConfirm: () => patch({ status: 'canceled' }),
        });
        if (done) toast('Fatura cancelada.');
      } else if (b.dataset.act === 'reopen') {
        done = await modal({
          title: 'Reabrir fatura', confirm: 'Reabrir', cancel: 'Voltar',
          body: `<p>A fatura <b>${esc(label)}</b> volta a ficar em aberto${inv.status === 'paid' ? ' e o registro de pagamento será apagado. A mensalidade seguinte gerada automaticamente (se houver) não é removida' : ''}.</p>`,
          onConfirm: () => patch({ status: 'pending' }),
        });
        if (done) toast('Fatura reaberta.');
      }
      if (done) reload();
    }));

    // Excluir cliente
    $('#del').addEventListener('click', async () => {
      const ok = await modal({
        title: 'Excluir cliente', danger: true, confirm: 'Excluir definitivamente',
        body: `<p>Isso apaga <b>${esc(t.restaurant_name)}</b> com conta, faturas, site e fotos. Não há como desfazer.</p>
          <label class="field">Digite <code>${esc(t.slug)}</code> para confirmar<input class="input" name="confirm" autocomplete="off" autocapitalize="off" spellcheck="false"></label>`,
        onOpen: (root, setEnabled) => {
          setEnabled(false);
          $('[name=confirm]', root).addEventListener('input', (e) => setEnabled(e.target.value.trim() === t.slug));
        },
        onConfirm: () => api('DELETE', '/tenants/' + encodeURIComponent(t.id)),
      });
      if (ok) { toast('Cliente excluído.'); go('#/clientes'); }
    });
  }

  // ---------- Cobranças ----------
  async function pageBilling(isCurrent) {
    view().innerHTML = `<div class="page-head"><div><h1>Cobranças${EM_AJUSTE.pagamento ? SELO : ''}</h1><p>Clientes que pedem atenção: inadimplentes e vencimentos dos próximos 7 dias.</p>${EM_AJUSTE.pagamento ? AVISO_PAGAMENTO : ''}</div></div>${loadingBlock()}`;
    let r, s;
    try { [r, s] = await Promise.all([api('GET', '/tenants'), api('GET', '/stats')]); }
    catch (err) { if (isCurrent()) view().innerHTML = errorBlock(err.message); return; }
    if (!isCurrent()) return;
    const all = r.tenants || [];
    const late = all.filter((t) => t.overdue_count > 0 || t.status === 'overdue')
      .sort((a, b) => (b.overdue_count - a.overdue_count) || String(a.next_due_date).localeCompare(String(b.next_due_date)));
    const lateIds = new Set(late.map((t) => t.id));
    const soon = all.filter((t) => {
      if (lateIds.has(t.id) || ['canceled', 'suspended'].includes(t.status)) return false;
      const d = daysUntil(t.next_due_date);
      return d !== null && d >= 0 && d <= 7;
    }).sort((a, b) => String(a.next_due_date).localeCompare(String(b.next_due_date)));

    const whenTxt = (iso) => {
      const d = daysUntil(iso);
      if (d === null) return '';
      if (d === 0) return 'vence hoje';
      if (d === 1) return 'vence amanhã';
      if (d > 1) return `em ${d} dias`;
      return d === -1 ? 'venceu ontem' : `venceu há ${-d} dias`;
    };
    const table = (rows, kind) => rows.length ? `<div class="table-wrap"><table class="t-bill"><thead><tr>
        <th>Restaurante</th><th>Responsável</th><th>Status</th><th>${kind === 'late' ? 'Faturas vencidas' : 'Plano'}</th><th>Próx. vencimento</th><th class="r"></th></tr></thead><tbody>
        ${rows.map((t) => {
          const wa = waLink(t.owner_phone);
          return `<tr class="click" data-open="${esc(t.id)}" tabindex="0">
            <td><div style="font-weight:500">${esc(t.restaurant_name)}</div><div class="sub">/${esc(t.slug)}</div></td>
            <td><div>${esc(t.owner_name || '—')}</div><div class="sub">${wa ? `<a href="${esc(wa)}" target="_blank" rel="noopener noreferrer">${esc(fmtPhone(t.owner_phone))}</a>` : esc(t.owner_email || '')}</div></td>
            <td>${badge(t.status)}</td>
            <td class="num">${kind === 'late' ? `<b style="color:var(--danger)">${esc(t.overdue_count)}</b>` : planTag(t.plan)}</td>
            <td class="nowrap num">${esc(fmtDate(t.next_due_date))}<div class="sub">${esc(whenTxt(t.next_due_date))}</div></td>
            <td class="r"><a class="btn sm" href="${esc(clientHash(t.id))}">Abrir</a></td></tr>`;
        }).join('')}</tbody></table></div>` : `<div class="empty">${kind === 'late' ? 'Nenhum cliente inadimplente. 🎉' : 'Nenhum vencimento nos próximos 7 dias.'}</div>`;

    view().innerHTML = `<div class="page-head"><div><h1>Cobranças${EM_AJUSTE.pagamento ? SELO : ''}</h1><p>Clientes que pedem atenção: inadimplentes e vencimentos dos próximos 7 dias.</p>${EM_AJUSTE.pagamento ? AVISO_PAGAMENTO : ''}</div>
        <button class="btn sm" type="button" id="refresh">Atualizar</button></div>
      <div class="kpis">
        <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--danger)"></span>Em atraso</div><div class="val">${esc(money(s.overdue?.v))}</div><div class="sub">${esc(s.overdue?.n || 0)} fatura(s)</div></div>
        <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--overdue)"></span>Em aberto</div><div class="val">${esc(money(s.pending?.v))}</div><div class="sub">${esc(s.pending?.n || 0)} fatura(s)</div></div>
        <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--active)"></span>Recebido no mês</div><div class="val">${esc(money(s.receivedThisMonthCents))}</div></div>
      </div>
      <div class="stack">
        <div class="card"><div class="card-head"><h2>Inadimplentes</h2><span class="small muted">${late.length}</span></div>${table(late, 'late')}</div>
        <div class="card"><div class="card-head"><h2>Vencem nos próximos 7 dias</h2><span class="small muted">${soon.length}</span></div>${table(soon, 'soon')}</div>
      </div>`;
    $('#refresh').onclick = () => route();
  }

  // ---------- Configurações ----------
  async function pageSettings(isCurrent) {
    view().innerHTML = `<div class="page-head"><div><h1>Configurações</h1><p>Dados exibidos aos clientes e acesso ao painel.</p></div></div>${loadingBlock()}`;
    let r;
    try { r = await api('GET', '/settings'); } catch (err) { if (isCurrent()) view().innerHTML = errorBlock(err.message); return; }
    if (!isCurrent()) return;
    const st = r.settings || {};
    view().innerHTML = `<div class="page-head"><div><h1>Configurações</h1><p>Dados exibidos aos clientes e acesso ao painel.</p></div></div>
      <div class="stack" style="max-width:720px">
        <div class="card"><div class="card-head"><h2>Empresa e cobrança</h2></div>
          <form class="card-body" id="set-form" novalidate>
            <div class="grid2">
              <label class="field">Nome da empresa<input class="input" name="company_name" maxlength="500" value="${esc(st.company_name)}"></label>
              <label class="field">WhatsApp do suporte<input class="input" name="support_whatsapp" maxlength="500" inputmode="tel" placeholder="(11) 99999-9999" value="${esc(st.support_whatsapp)}"></label>
              <label class="field" style="grid-column:1/-1">Chave PIX<input class="input" name="pix_key" maxlength="500" value="${esc(st.pix_key)}"></label>
              <label class="field" style="grid-column:1/-1">Observação de cobrança<textarea class="input" name="billing_note" maxlength="500">${esc(st.billing_note)}</textarea><span class="small muted" style="font-weight:400">Aparece para o cliente na área de faturas do painel dele.</span></label>
            </div>
            <div class="form-actions"><button class="btn primary" type="submit">Salvar</button></div>
          </form></div>
        <div class="card"><div class="card-head"><h2>Senha do administrador</h2><span class="small muted">${esc(me?.email || '')}</span></div>
          <form class="card-body" id="pw-form" novalidate>
            <input type="text" name="username" autocomplete="username" value="${esc(me?.email || '')}" hidden>
            <div class="grid3">
              <label class="field">Senha atual<input class="input" type="password" name="current" autocomplete="current-password" required></label>
              <label class="field">Nova senha<input class="input" type="password" name="next" autocomplete="new-password" minlength="10" required></label>
              <label class="field">Repita a nova senha<input class="input" type="password" name="next2" autocomplete="new-password" minlength="10" required></label>
            </div>
            <div class="small muted" style="margin-top:8px">Mínimo de 10 caracteres.</div>
            <div class="form-actions"><button class="btn primary" type="submit">Trocar senha</button></div>
          </form></div>
      </div>`;
    $('#set-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = $('button[type=submit]', f);
      const body = {};
      for (const k of ['company_name', 'pix_key', 'support_whatsapp', 'billing_note']) body[k] = f[k].value.trim();
      try { await withBtn(btn, () => api('PUT', '/settings', body)); toast('Configurações salvas.'); }
      catch (err) { toast(err.message, 'err'); }
    });
    $('#pw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = $('button[type=submit]', f);
      if (!f.current.value) { toast('Informe a senha atual.', 'err'); f.current.focus(); return; }
      if (f.next.value.length < 10) { toast('A nova senha precisa ter pelo menos 10 caracteres.', 'err'); f.next.focus(); return; }
      if (f.next.value !== f.next2.value) { toast('As senhas novas não conferem.', 'err'); f.next2.focus(); return; }
      try {
        await withBtn(btn, () => api('PUT', '/password', { current: f.current.value, next: f.next.value }));
        f.reset(); toast('Senha alterada.');
      } catch (err) { toast(err.message, 'err'); }
    });
  }

  // ---------- Início ----------
  (async function boot() {
    try {
      const res = await fetch('/api/admin/me', { credentials: 'same-origin' });
      if (res.ok) { me = (await res.json()).admin; showApp(); }
      else showLogin();
    } catch { showLogin('Não foi possível conectar ao servidor.'); }
  })();
})();
</script>
</body>
</html>
